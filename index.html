<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이미지 압축 도구 - 브라우저에서 바로 사진 용량 줄이기</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <h1>이미지 압축 도구</h1>
    <p class="subtitle">사진이 서버로 전송되지 않고, 이 브라우저 안에서만 처리됩니다.</p>

    <section class="upload-area" id="uploadArea">
      <input type="file" id="fileInput" class="visually-hidden" accept="image/jpeg,image/png,image/webp">
      <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3v12"></path>
        <path d="M7 8l5-5 5 5"></path>
        <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"></path>
      </svg>
      <button type="button" class="upload-btn">파일 선택</button>
      <p class="upload-hint">또는 파일을 이 영역에 끌어다 놓으세요</p>
      <p class="upload-formats">JPG, PNG, WebP 지원 · 최대 20MB</p>
      <div id="errorMessage" class="error-message" hidden></div>
    </section>

    <section class="controls" id="controls" hidden>
      <label for="qualitySlider">압축 품질: <span id="qualityValue">80</span>%</label>
      <input type="range" id="qualitySlider" min="10" max="100" value="80">

      <div class="resize-fields">
        <label class="resize-label">가로(px)
          <input type="number" id="resizeWidth" min="1" max="8000">
        </label>
        <label class="resize-label">세로(px)
          <input type="number" id="resizeHeight" min="1" max="8000">
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="maintainAspectRatio" checked>
          비율 유지
        </label>
      </div>

      <label for="formatSelect">출력 형식</label>
      <select id="formatSelect">
        <option value="original">원본과 동일</option>
        <option value="image/jpeg">JPG</option>
        <option value="image/png">PNG</option>
        <option value="image/webp">WebP</option>
      </select>

      <button id="compressBtn">적용하기</button>
    </section>

    <section class="preview-area" id="previewArea" hidden>
      <div class="preview-box">
        <h2>원본</h2>
        <img id="originalPreview" alt="원본 이미지 미리보기">
        <p id="originalSize"></p>
      </div>
      <div class="preview-box">
        <h2>결과</h2>
        <img id="compressedPreview" alt="압축된 이미지 미리보기">
        <p id="compressedSize"></p>
        <p id="compressWarning" class="compress-warning" hidden>⚠ 압축 결과가 원본보다 커요. 품질을 낮추거나 다운로드하지 않는 걸 권장해요.</p>
        <a id="downloadBtn" href="#" download="compressed-image.jpg" hidden>다운로드</a>
      </div>
    </section>
  </main>

  <script src="js/imageTools.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
